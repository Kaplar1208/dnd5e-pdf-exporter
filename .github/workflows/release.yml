name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches module.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION=$(node -p "require('./module.json').version")
          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match module.json version ($MODULE_VERSION)"
            exit 1
          fi

      - name: Build module zip
        run: |
          zip -r dnd5e-pdf-multilang-exporter.zip \
            module.json \
            lang \
            scripts \
            templates \
            tools

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dnd5e-pdf-multilang-exporter.zip
            module.json
          generate_release_notes: true
